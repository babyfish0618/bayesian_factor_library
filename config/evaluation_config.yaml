# 贝叶斯因子选择器 - 评价配置
# 版本: 1.0.0
# 日期: 2026-03-01

annualization_days: 250   # 年化天数（全局统一，替代代码中的硬编码252）

# ==================== 时间窗口配置 ====================
time_windows:
  # 选择因子时的多时间尺度
  selection:
    short_term: 5      # 短期窗口 (天)
    medium_term: 20    # 中期窗口 (天) 
    long_term: 60      # 长期窗口 (天)
  
  # 评估成功时的窗口
  evaluation:
    selected_short: 10     # 选中因子评估窗口 (较短)
    selected_long: 20      # 选中因子评估窗口 (较长)
    unselected_long: 40    # 没选中因子边际贡献评估窗口 (较长，更严格)
  
  # IC计算相关
  ic_calculation:
    min_periods_abs: 5      # IC/ICIR最小样本绝对门槛
    min_periods_ratio: 0.5  # IC/ICIR最小样本比例门槛(相对窗口长度)

# ==================== 指标权重配置 ====================
indicator_weights:
  # 选择因子时的指标权重
  selection:
    icir: 0.4              # ICIR权重
    ls_return: 0.3         # 多空收益权重
    rank_percentile: 0.2   # 排名权重
    stability: 0.1         # 稳定性权重

# ==================== 成功阈值配置 ====================
success_thresholds:
  # 选中因子阈值 (相对宽松)
  selected:
    icir: 0.8              # ICIR > 0.8
    rank_percentile: 0.7    # 排名在前70%
    win_rate: 0.55          # 胜率 > 55%
  
  # 没选中因子阈值 (非常严格)
  unselected:
    max_correlation: 0.6    # 与选中因子最大相关性 < 0.6

# ==================== 贝叶斯参数配置 ====================
bayesian:
  prior_alpha: 1.0          # 先验成功次数
  prior_beta: 1.0           # 先验失败次数
  update_rules:
    selected_success: 1.0   # 选中因子成功: α += 1
    selected_failure: 1.0   # 选中因子失败: β += 1
    unselected_success: 0.5 # 没选中因子成功: α += 0.5 (更谨慎)
    unselected_failure: 0.0 # 没选中因子失败: 不更新 (不轻易惩罚)
  selection_blend:
    aggregate_score: 0.7    # 综合打分权重 [当前已使用]
    bayesian_score: 0.3     # Thompson采样权重 [当前已使用]

# ==================== 相关性计算配置 ====================
correlation:
  method: "pearson"         # pearson/spearman/kendall
  min_common_periods: 20    # 最小共同期数
  significance_level: 0.05  # 显著性水平

# ==================== 边际贡献配置 ====================
marginal_contribution:
  method: "equal_weight"  # 边际贡献内部组合方法
  annualization_factor: 250  # 组合模拟年化天数（应与annualization_days一致）
  replacement_strategy: "correlation_based"    # correlation_based/effectiveness_based
  improvement_threshold: 0.01  # 最小改善阈值
  scoring:
    weights:
      improvement: 0.4      # 综合得分-边际改善权重 [当前已使用]
      correlation: 0.3      # 综合得分-相关性权重 [当前已使用]
      quality: 0.2          # 综合得分-候选质量权重 [当前已使用]
      feasibility: 0.1      # 综合得分-替换可行性权重 [当前已使用]
    grade_scores:
      high: 1.0             # 高档评分 [当前已使用]
      medium: 0.7           # 中档评分 [当前已使用]
      low: 0.4              # 低档评分 [当前已使用]
      fallback: 0.1         # 最低评分 [当前已使用]
    quality_thresholds:
      high: 2.0             # ICIR/Sharpe高档阈值 [当前已使用]
      medium: 1.0           # ICIR/Sharpe中档阈值 [当前已使用]
      low: 0.5              # ICIR/Sharpe低档阈值 [当前已使用]
    feasibility_scores:
      replace: 1.0          # 可替换评分 [当前已使用]
      no_replace: 0.3       # 不可替换评分 [当前已使用]
    correlation_low_ratio: 0.5            # 低相关分段比例 [当前已使用]
    decision_success_score: 0.7           # 判定success的score阈值 [当前已使用]
    decision_failure_score: 0.3           # 判定failure的score阈值 [当前已使用]
    decision_failure_improvement: -0.1    # 判定failure的improvement阈值 [当前已使用]
    decision_corr_fail_multiplier: 1.2    # 相关性过高判定倍数 [当前已使用]

# ==================== 调试与日志配置 ====================
debug:
  log_level: "INFO"         # DEBUG/INFO/WARNING/ERROR
  save_intermediate: true   # 保存中间结果
  plot_figures: false       # 生成图表
  performance_tracking: true # 跟踪性能指标

# ==================== 因子库出库标准（strict_holdout） ====================
library_selection:
  anchor:
    enabled: true
    method: "round_1"                # round_1 | fixed_formula | custom_ids
    fixed_formula:
      type: "aggregate_topk"         # 预留：固定公式锚库
    custom_ids_file: ""              # 预留：自定义锚库ID列表文件

  objective:
    primary_metric: "oos_sharpe"     # oos_sharpe | oos_icir | oos_ls_mean
    secondary_metric: "oos_icir"

  thresholds:
    min_improve_vs_prev: 0.0                 # 主指标相对前一轮最小改善
    min_improve_vs_anchor: 0.0               # 主指标相对锚库最小改善
    min_improve_vs_anchor_secondary: 0.0     # 次指标相对锚库最小改善

  stability_gate:
    enabled: true
    mode: "k_of_n"                    # all | k_of_n
    k_of_n:
      k: 3
      n: 4
    turnover_max: 0.85
    delta_sharpe_raw_max: 0.10
    delta_icir_raw_max: 0.10
    excess_vs_prev_min: -0.02

  fallback:
    when_no_candidate: "best_validation"   # best_validation | last_round

# ==================== 版本控制 ====================
version: "1.0.0"
description: "贝叶斯因子选择器评价配置 - 多时间尺度多指标版本"
last_updated: "2026-03-01"
